version: "3"

services:
  aerofoil:
    container_name: aerofoil
    # Share the host network so LAN discovery broadcasts reach the container.
    network_mode: host
    # If LAN discovery is not required, use bridge networking with port mappings:
    # remove or comment out network_mode above, then uncomment ports below.
    # ports:
    #   - "8465:8465/tcp"
    #   - "8465:8465/udp" # Optional; does not guarantee LAN broadcast delivery.
    image: luketanti/aerofoil:latest
    environment:
      # For write permission in config directory
      - PUID=1000
      - PGID=1000
      # Optional SSD-backed staging path for NSP/XCI -> NSZ/XCZ conversion work
      - AEROFOIL_CONVERSION_STAGING_DIR=/app/conversion-tmp
      # to create/update an admin user at startup
      # - USER_ADMIN_NAME=admin
      # - USER_ADMIN_PASSWORD=asdvnf!546
      # to create/update a regular user at startup
      # - USER_GUEST_NAME=guest
      # - USER_GUEST_PASSWORD=oerze!@8981
    volumes:
      - /your/game/directory:/games
      - ./config:/app/config
      - ./data:/app/data
      - ./conversion-tmp:/app/conversion-tmp
