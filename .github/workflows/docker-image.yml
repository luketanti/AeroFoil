name: Build and Push Docker Image (Release)

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: docker-release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Compute release tags
        id: meta
        run: |
          version=${GITHUB_REF#refs/tags/v}
          major=${version%%.*}
          remainder=${version#*.}
          minor=$major.${remainder%%.*}
          echo "version=v$version" >> "$GITHUB_OUTPUT"
          {
            echo 'tags<<IMAGE_TAGS'
            echo 'luketanti/aerofoil:latest'
            echo "luketanti/aerofoil:$version"
            echo "luketanti/aerofoil:$major"
            echo "luketanti/aerofoil:$minor"
            echo "luketanti/aerofoil:sha-${GITHUB_SHA::7}"
            echo IMAGE_TAGS
          } >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    uses: ./.github/workflows/docker-native-build.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      tags: ${{ needs.metadata.outputs.tags }}
      cache_scope: release
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
