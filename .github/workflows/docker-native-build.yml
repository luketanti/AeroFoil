name: Native Docker build

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      tags:
        required: true
        type: string
      cache_scope:
        required: true
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

env:
  IMAGE: luketanti/aerofoil

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify native runner
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          case "$EXPECTED_ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "Runner architecture does not match $EXPECTED_ARCH" >&2; exit 1 ;;
          esac

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            AEROFOIL_VERSION=${{ inputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ inputs.cache_scope }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }}-${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Check container architecture and runtime
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.arch }}
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          docker run --rm --entrypoint python \
            -e EXPECTED_ARCH -e EXPECTED_VERSION "$IMAGE@$DIGEST" -c '
          import os, platform, stat
          import flask, sqlalchemy, zstandard
          expected_machine = {"amd64": "x86_64", "arm64": "aarch64"}[os.environ["EXPECTED_ARCH"]]
          assert platform.machine() == expected_machine, platform.machine()
          assert os.environ["AEROFOIL_VERSION"] == os.environ["EXPECTED_VERSION"]
          assert os.stat("/app/run.sh").st_mode & stat.S_IXUSR
          print("Container architecture, version, dependencies, and entrypoint verified")'

      - name: Export verified digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digests/$ARCH"

      - name: Upload verified digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish multi-platform tags
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download verified digests
        uses: actions/download-artifact@v4
        with:
          pattern: image-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish and verify multi-platform image
        env:
          IMAGE_TAGS: ${{ inputs.tags }}
        run: |
          sources=()
          for arch in amd64 arm64; do
            digest=$(cat "$RUNNER_TEMP/digests/$arch")
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            sources+=("$IMAGE@$digest")
          done
          tag_args=()
          while IFS= read -r tag; do
            [[ -z "$tag" ]] && continue
            [[ "$tag" == "$IMAGE:"* ]]
            tag_args+=(--tag "$tag")
          done <<< "$IMAGE_TAGS"
          [[ ${#tag_args[@]} -gt 0 ]]
          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tag_args[1]}" --raw > "$RUNNER_TEMP/manifest.json"
          python - "$RUNNER_TEMP/manifest.json" <<'PY'
          import json, sys
          from pathlib import Path
          manifests = json.loads(Path(sys.argv[1]).read_text())["manifests"]
          platforms = {(m["platform"]["os"], m["platform"]["architecture"]) for m in manifests}
          assert len(manifests) == 2 and platforms == {("linux", "amd64"), ("linux", "arm64")}, platforms
          print("Verified multi-platform manifest contains exactly AMD64 and ARM64")
          PY
          {
            echo '## Docker build succeeded'
            echo 'Native builds and runtime checks passed for AMD64 and ARM64.'
            echo ''
            echo 'Published tags:'
            printf '%s\n' "$IMAGE_TAGS"
          } >> "$GITHUB_STEP_SUMMARY"
