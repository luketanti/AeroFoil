name: Docker Build (Branch Cache) and Push

on:
  push:
    branches:
      - dev
      - dev2
  workflow_dispatch:
    inputs:
      validation_only:
        description: Publish only a unique validation tag, leaving normal tags unchanged
        type: boolean
        default: false

concurrency:
  group: docker-dev${{ inputs.validation_only && format('-validation-{0}', github.ref) || '' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute tags
        id: meta
        env:
          VALIDATION_ONLY: ${{ inputs.validation_only || false }}
        run: |
          version=$(git describe --tags --always)
          echo "version=${version}-dev" >> "$GITHUB_OUTPUT"
          if [[ "$VALIDATION_ONLY" == true ]]; then
            tags="luketanti/aerofoil:validation-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            [[ "$GITHUB_REF_NAME" == dev || "$GITHUB_REF_NAME" == dev2 ]]
            tags=$(printf 'luketanti/aerofoil:dev\nluketanti/aerofoil:sha-%s' "${GITHUB_SHA::7}")
          fi
          {
            echo 'tags<<IMAGE_TAGS'
            printf '%s\n' "$tags"
            echo IMAGE_TAGS
          } >> "$GITHUB_OUTPUT"

  build:
    needs: metadata
    uses: ./.github/workflows/docker-native-build.yml
    with:
      version: ${{ needs.metadata.outputs.version }}
      tags: ${{ needs.metadata.outputs.tags }}
      cache_scope: ${{ github.ref_name }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
